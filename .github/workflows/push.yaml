name: Release Charts

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}' | tr -d '"')
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Chart.yaml version=${VERSION} tag=${TAG}"

      - name: Package chart
        run: |
          helm dependency update .
          mkdir -p dist
          helm package . -d dist/
          ls -la "dist/n8n-${{ steps.chart.outputs.VERSION }}.tgz"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.chart.outputs.TAG }}"
          VERSION="${{ steps.chart.outputs.VERSION }}"
          TGZ="dist/n8n-${VERSION}.tgz"
          REPORT="docs/chart-verifier-report-${VERSION}.yaml"

          ASSETS=("$TGZ")
          if [ -f "$REPORT" ]; then
            ASSETS+=("$REPORT")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Updated assets on existing release ${TAG}"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes \
              --latest
            echo "Created release ${TAG}"
          fi
