# OpenShift Developer Sandbox values for n8n chart 1.19.0 (n8n 2.45.7)
#
# Prerequisites:
#   1. Create a PVC named "n8n" (2Gi, RWO) in your project, or change existingClaim below.
#   2. Deploy OpenShift MCP Server (Developer Sandbox overlay) for MCP tools + LiteLLM/Qwen:
#        helm upgrade --install openshift-mcp-server \
#          https://maximilianoPizarro.github.io/openshift-mcp-server/openshift-mcp-server-0.1.0-alpha.tgz \
#          -f https://raw.githubusercontent.com/maximilianoPizarro/openshift-mcp-server/main/helm/openshift-mcp-server/values-developer-sandbox.yaml \
#          --set namespace=$NAMESPACE \
#          --set litellm.model.name=granite \
#          --set litellm.model.apiKey=$(oc whoami -t)
#
# Install:
#   helm repo add n8n-openshift https://maximilianopizarro.github.io/n8n-helm-chart/
#   helm install n8n n8n-openshift/n8n --version 1.19.0 -f values-sandbox.yaml
#
# Notes:
#   - Chart injects HOME, N8N_USER_FOLDER, and XDG_CACHE_HOME from main.persistence.mountPath.
#     Do not set those again in extraEnvVars (avoids duplicate env keys).
#   - Leave main.securityContext / main.podSecurityContext unset so restricted-v2
#     can assign a random UID in the namespace range.
#   - Instance AI uses LiteLLM → sandbox-shared-models Qwen (aliased as "granite").
#     Full AI Assistant workflow-builder needs Daytona / n8n-sandbox (privileged);
#     on Developer Sandbox we enable the model + MCP for assistant chat / Ask AI.

image:
  # Official image for Sandbox smoke; switch to quay.io/maximilianopizarro/n8n after UBI 2.45.7 publish
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "2.45.7"
  variant: "official"

enableServiceLinks: false

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000

route:
  enabled: true
  sccRoleDisabled: true
  host: ""

main:
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    # OpenShift Route sets X-Forwarded-*; required for express-rate-limit / login
    N8N_PROXY_HOPS: "1"
    NODE_FUNCTION_ALLOW_BUILTIN: "*"
    NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    # Built-in AI Assistant (instance-ai) → LiteLLM / sandbox Qwen
    N8N_ENABLED_MODULES: "instance-ai"
    N8N_INSTANCE_AI_MODEL: "granite"
    N8N_INSTANCE_AI_MODEL_URL: "http://openshift-mcp-server-litellm:4000/v1"
    N8N_INSTANCE_AI_MODEL_API_KEY: "sk-openshift-mcp-1234"
    N8N_INSTANCE_AI_MCP_SERVERS: "openshift=http://openshift-mcp-server:8080/mcp,kubernetes=http://openshift-mcp-server-k8s-mcp:8085/mcp"
    # Web search via in-cluster SearXNG (deploy separately or chart optional later)
    N8N_INSTANCE_AI_SEARXNG_URL: "http://n8n-searxng:8080"
    # Code sandbox: Developer Sandbox cannot run privileged n8n-sandbox (DinD/Sysbox).
    # Use Daytona instead, then set:
    #   N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
    #   N8N_INSTANCE_AI_SANDBOX_PROVIDER: "daytona"
    #   DAYTONA_API_URL: "https://app.daytona.io/api"
    #   DAYTONA_API_KEY: "<your-key>"
    N8N_INSTANCE_AI_SANDBOX_ENABLED: "false"
  config:
    n8n:
      editor_base_url: "https://n8n-maximilianopizarro5-dev.apps.rm2.thpm.p1.openshiftapps.com"
      user_folder: "/data"
  service:
    type: ClusterIP
    port: 5678
  persistence:
    enabled: true
    type: existing
    existingClaim: n8n
    mountPath: "/data"

mailpit:
  enabled: true
  route:
    enabled: true
  podSecurityContext: {}

workflows:
  autoImport:
    enabled: true
    urls:
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-pod-monitor-mcp-agent.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-pod-monitor-mcp-granite.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-deployment-rollout-status.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-resource-quota-monitor.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-security-audit.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-route-tls-expiry.json
      - https://raw.githubusercontent.com/maximilianoPizarro/n8n-helm-chart/main/workflows/workflow-event-anomaly-detector.json
